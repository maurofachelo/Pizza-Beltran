<main class="login">
  <div class="panel">
    <span class="eyebrow">PIZZAS FRAY LUIS BELTRÁN</span>
    <h2>Ingreso del equipo</h2>
    <p>Administrá el menú y confirmá los pedidos recibidos.</p>

    <form [formGroup]="form" (ngSubmit)="ingresar()">
      <label for="usuario">Usuario</label>
      <input id="usuario" formControlName="usuario" />

      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" />

      <button type="submit" [disabled]="form.invalid">Ingresar al panel</button>
      <small *ngIf="error">Usuario o contraseña incorrectos.</small>
    </form>

    <a routerLink="/">Volver al menú</a>
  </div>
</main>
