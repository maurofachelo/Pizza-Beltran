<main class="login">
  <div class="panel">
    <span class="eyebrow">PIZZAS FRAY LUIS BELTRÁN</span>
    <h2>Ingreso del equipo</h2>
    <p>Administrá el menú, supervisá la cocina y confirmá los pedidos recibidos.</p>

    <form [formGroup]="form" (ngSubmit)="ingresar()">
      <label for="usuario">Usuario</label>
      <input
        id="usuario"
        formControlName="usuario"
        placeholder="ej. admin"
        autocomplete="username"
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />

      <button type="submit" [disabled]="form.invalid">Ingresar al panel</button>
      <small *ngIf="error">Usuario o contraseña incorrectos.</small>
    </form>
  </div>
</main>
